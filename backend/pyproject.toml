[project]
name = "motorparts-agent"
version = "0.1.0"
description = "Motor-parts procurement agent backend skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.12",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-core>=1.2",
    "langchain-openai>=1.0",
    "langgraph>=1.2.8",
    "PyYAML>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/api_view"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
