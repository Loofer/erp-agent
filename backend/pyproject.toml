[project]
name = "motorparts-agent"
version = "0.1.0"
description = "Motor‑parts procurement agent backend skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.3",
    "langchain-openai>=1.1",
    # langgraph 若确认 0.7.4 兼容1.2.10，保留 ==；否则改成 >=1.2.10,<2
    "langgraph>=1.2.10,<2",
    "langgraph-checkpoint-postgres==3.1.1",
    # 修复：[inmem] → [all]
    "langgraph-cli[all]>=0.1.54",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pymilvus>=2.5,<3",
    "PyYAML>=6,<7",
    "sse-starlette>=3.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
rag-rerank = ["FlagEmbedding>=1.4,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/api_view", "src/visualization"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "uvicorn[standard]>=0.30"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
