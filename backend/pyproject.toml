[project]
name = "motorparts-agent"
version = "0.1.0"
description = "Motor-parts procurement agent backend skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
