[project]
name = "motorparts-agent"
version = "0.1.0"
description = "Motor‑parts procurement agent backend skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.6.12",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.3",
    "langchain-openai>=1.1",
    "langgraph==1.2.10",
    "langgraph-checkpoint-postgres==3.1.1",
    "langgraph-cli[inmem]>=0.1.54",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "PyYAML>=6,<7",
    "sse-starlette>=3.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/api_view"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "uvicorn[standard]>=0.30"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
